[workspace]
resolver = "3"
members = ["crates/am-core", "crates/am-hook", "crates/am-tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
am-core = { path = "crates/am-core" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
