[workspace]
resolver = "3"
members = ["crates/am-core", "crates/am-hook", "crates/am-tui", "crates/am-cli"]

[workspace.package]
version = "2.1.67"
edition = "2024"
license = "MIT"

[workspace.dependencies]
am-core = { path = "crates/am-core" }
am-hook = { path = "crates/am-hook" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
libc = "0.2"
ureq = { version = "3", default-features = false, features = ["rustls"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
# OpenTelemetry over OTLP/HTTP with our own ureq client: no tokio, reqwest or
# hyper, and no `internal-logs` (the SDK would log into our own subscriber).
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "trace", "metrics", "logs"] }
opentelemetry-http = { version = "0.33.1", default-features = false }
opentelemetry-appender-tracing = { version = "0.33.1", default-features = false }
tracing-opentelemetry = { version = "0.34.0", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
