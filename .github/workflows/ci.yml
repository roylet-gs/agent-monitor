name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: npm launcher finds and runs the native binary
        run: |
          cargo build -p am-cli -p am-tui -p am-hook
          out=$(AM_BINARY_DIR=target/debug node npm/agent-monitor/bin/am.js --version)
          echo "$out"
          echo "$out" | grep -q '^am '
