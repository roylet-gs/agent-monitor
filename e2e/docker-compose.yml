services:
  mock-api:
    build:
      context: ..
      dockerfile: e2e/Dockerfile
      target: deps
    working_dir: /work
    command: ["npx", "tsx", "e2e/mock-api/server.ts"]
    # Host ports are chosen by Docker so parallel stacks (one per worktree,
    # see e2e/run.sh) don't collide; `pnpm test:e2e:ports` prints them.
    ports:
      - "4100"
    volumes:
      - ../e2e/mock-api:/work/e2e/mock-api:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4100/health"]
      interval: 2s
      timeout: 3s
      retries: 10

  # The native binaries (am-tui / am / am-hook) behind ttyd.
  app:
    build:
      context: ..
      dockerfile: e2e/Dockerfile
      target: app
    depends_on:
      mock-api:
        condition: service_healthy
    ports:
      - "7681" # seeded dashboard
      - "7682" # fresh data dir per connection (setup wizard)
      - "7683" # seeded dashboard after a hook in the untracked /home/user/late-repo
    environment:
      - AM_DATA_DIR=/tmp/am-e2e
      - AM_MOCK_API_URL=http://mock-api:4100
      - AM_LINEAR_API_URL=http://mock-api:4100/linear
      # Usage reports a spec turns on must never reach the real relay.
      - AM_TELEMETRY_ENDPOINT=http://mock-api:4100/telemetry
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7681/"]
      interval: 2s
      timeout: 3s
      retries: 30

  tests:
    build:
      context: ..
      dockerfile: e2e/Dockerfile
      target: test
    depends_on:
      app:
        condition: service_healthy
    environment:
      - TUI_URL=http://app:7681
      - TUI_FRESH_URL=http://app:7682
      - TUI_LATE_SESSION_URL=http://app:7683
      - MOCK_API_URL=http://mock-api:4100
      # Playwright file filters picked by e2e/run.sh; empty = every spec.
      - E2E_SPECS=${E2E_SPECS:-}
    volumes:
      - ../tests/e2e/tmp:/work/tests/e2e/tmp
